<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Mohengo Gaëtan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">Mohengo Gaëtan</a>

    <nav class="main-nav" id="mainNav">
      <a href="index.html#about">À propos</a>
      <a href="index.html#portfolio">Portfolio</a>
      <a href="index.html#pricing">Tarifs</a>
      <a href="index.html#testimonials">Témoignages</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>

    <button class="burger" id="burger" aria-label="Ouvrir le menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<!-- ===== CONTACT PAGE ===== -->
<section class="contacts contact-page" id="contacts">
  <div class="container contacts-inner">
    <div>
      <h2 class="section-title">Contact</h2>
      <p class="contacts-lead">Prêt à capturer votre histoire ? Contactez-moi et planifions ensemble votre séance photo.</p>
      <p class="contacts-line">hello@mohengogaetan.com</p>
      <p class="contacts-line">+380 12 345 6789</p>
      <p class="contacts-line">Kyiv, Ukraine</p>
      <div class="social-icons">
        <a href="#" aria-label="Instagram" class="icon-square">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="0.6" fill="currentColor" stroke="none"/></svg>
        </a>
        <a href="#" aria-label="Facebook" class="icon-square">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 22v-8.5H16l.4-3.3h-2.9V8.1c0-.96.27-1.6 1.66-1.6h1.77V3.5C16.6 3.4 15.6 3.3 14.5 3.3c-2.6 0-4.4 1.6-4.4 4.5v2.4H7.6v3.3h2.5V22h3.4z"/></svg>
        </a>
      </div>
    </div>

    <form class="contact-form" id="contactForm">
      <input type="text" placeholder="Votre nom" required>
      <input type="email" placeholder="Votre e-mail" required>
      <textarea rows="5" placeholder="Parlez-moi de votre projet photo..." required></textarea>
      <button type="submit" class="btn btn-primary btn-block">Envoyer le message</button>
    </form>
  </div>

  <p class="footer-bottom">© 2026 Mohengo Gaëtan. Tous droits réservés.</p>
</section>

<script src="js/script.js"></script>
</body>
</html>
